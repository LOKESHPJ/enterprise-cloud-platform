name: Destroy enterprise stack

# Stops the hourly spend. Requires the same explicit confirmation as deploy.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY-BILLABLE to tear down the enterprise stack'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.17.2
  AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: cloudforge-terraform-locks
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  destroy:
    name: Terraform destroy
    if: inputs.confirm == 'DESTROY-BILLABLE'
    runs-on: ubuntu-latest
    environment: production-enterprise
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Check repository configuration
        run: |
          missing=0
          for v in AWS_TERRAFORM_ROLE_ARN TF_STATE_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "::error::$v repository variable is not set. See README Quick start, step 3."
              missing=1
            fi
          done
          exit $missing
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: gha-enterprise-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Destroy
        run: |
          terraform destroy -input=false -auto-approve \
            -var="confirm_spend=true" \
            -var="enable_services=false"

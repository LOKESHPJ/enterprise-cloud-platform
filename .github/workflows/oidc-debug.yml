name: OIDC debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Decode the OIDC token GitHub issues
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "$PAYLOAD" | jq .
          echo "----- attempt assume -----"
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::000000000000:role/ecp-gha-serverless \
            --role-session-name debug \
            --web-identity-token "$TOKEN" \
            --duration-seconds 900 2>&1) || echo "ASSUME FAILED: $CREDS"
          echo "$CREDS" | head -20

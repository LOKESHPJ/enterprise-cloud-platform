name: Destroy serverless

# Deliberate teardown. Requires typing "destroy" so it cannot fire by accident.
# Removes every resource the serverless stack created, leaving only the remote
# state bucket behind (kept so the stack can be recreated later).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the serverless stack'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.17.2
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: cloudforge-terraform-locks
  AWS_SERVERLESS_ROLE_ARN: ${{ vars.AWS_SERVERLESS_ROLE_ARN }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  destroy:
    name: Terraform destroy
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: serverless-destroy
    defaults:
      run:
        working-directory: infrastructure/serverless
    steps:
      - uses: actions/checkout@v4

      - name: Check repository configuration
        run: |
          missing=0
          for v in AWS_SERVERLESS_ROLE_ARN AWS_TERRAFORM_ROLE_ARN TF_STATE_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "::error::$v repository variable is not set. See README Quick start, step 3."
              missing=1
            fi
          done
          exit $missing
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_SERVERLESS_ROLE_ARN }}
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package (required by the plan graph)
        working-directory: application/backend
        run: |
          mkdir -p ../../dist/lambda
          python -m pip install --quiet --target ../../dist/lambda -r requirements-lambda.txt
          cp -r app ../../dist/lambda/
          cp lambda_handler.py ../../dist/lambda/
          cd ../../dist/lambda && zip -qr ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*"

      - run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
      - run: terraform destroy -input=false -auto-approve

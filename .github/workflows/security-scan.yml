name: Security scanning

# Three independent gates, none of which need a local machine:
#   trivy   - dependency CVEs and committed secrets
#   checkov - Terraform misconfiguration policy
#   gitleaks- git history secret scan
#
# Failing here blocks the deploy workflows via branch protection or by simply
# being the visible red check on the commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy (dependencies and secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan filesystem for vulnerabilities and secrets
        run: |
          trivy fs . \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --skip-dirs .terraform \
            --skip-dirs .git

      - name: Summary
        if: always()
        run: |
          {
            echo "### Trivy"
            echo "Gate: fails on HIGH or CRITICAL findings with an available fix."
            echo "Scanned: Python requirements, npm dependencies, repository secrets."
          } >> "$GITHUB_STEP_SUMMARY"

  checkov:
    name: Checkov (Terraform policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          output_format: cli
          soft_fail: false
          quiet: true
          config_file: .checkov.yaml

  gitleaks:
    name: Gitleaks (git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

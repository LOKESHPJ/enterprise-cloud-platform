name: Build and push images

# Builds both container images on GitHub runners and pushes them to ECR.
# No local Docker, no local registry. Tags are immutable commit SHAs.

on:
  push:
    branches: [main]
    paths:
      - "application/**"
      - "docker/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: cloudforge-terraform-locks

jobs:
  preflight:
    name: Are the enterprise images provisioned?
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check repository configuration
        run: |
          missing=0
          for v in AWS_SERVERLESS_ROLE_ARN AWS_TERRAFORM_ROLE_ARN TF_STATE_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "::error::$v repository variable is not set. See README Quick start, step 3."
              missing=1
            fi
          done
          exit $missing
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: gha-preflight-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECR repositories
        id: check
        run: |
          if aws ecr describe-repositories --repository-names cloudforge-dev-api >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ECR repositories do not exist yet - the enterprise track has not been applied. Skipping image build."
          fi

  build:
    name: Build ${{ matrix.component }}
    needs: preflight
    if: needs.preflight.outputs.exists == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: application/backend/Dockerfile
          - component: web
            dockerfile: application/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: gha-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR repository
        id: ecr
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPO="${REGISTRY}/cloudforge-dev-${{ matrix.component }}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.registry }}"

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.repo }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Nothing reaches the registry unless it passes the CVE gate first.
      - name: Install Trivy and scan the image
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "${{ steps.ecr.outputs.repo }}:sha-${{ github.sha }}"

      - name: Push vetted image
        run: |
          set -euo pipefail
          docker tag "${{ steps.ecr.outputs.repo }}:sha-${{ github.sha }}" "${{ steps.ecr.outputs.repo }}:latest"
          docker push "${{ steps.ecr.outputs.repo }}:sha-${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.repo }}:latest"

      - name: Summary
        run: |
          {
            echo "### Pushed ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.ecr.outputs.repo }}:sha-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

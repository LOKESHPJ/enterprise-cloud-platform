name: Terraform plan (serverless)

# Read-only CI for pull requests: formatting, validation and a plan diff.
# No apply, no credentials beyond a read-mostly OIDC role.

on:
  # Pull request plans are intentionally manual: the deploy role is scoped to
  # `main` and protected environments, so untrusted PR code cannot assume it.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.17.2
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: cloudforge-terraform-locks
  AWS_SERVERLESS_ROLE_ARN: ${{ vars.AWS_SERVERLESS_ROLE_ARN }}
  ENABLE_CLOUDFRONT: ${{ vars.ENABLE_CLOUDFRONT || 'false' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/serverless
    steps:
      - uses: actions/checkout@v4

      - name: Check repository configuration
        run: |
          missing=0
          for v in AWS_SERVERLESS_ROLE_ARN AWS_TERRAFORM_ROLE_ARN TF_STATE_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "::error::$v repository variable is not set. See README Quick start, step 3."
              missing=1
            fi
          done
          exit $missing
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_SERVERLESS_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        working-directory: application/backend
        run: |
          mkdir -p ../../dist/lambda
          python -m pip install --quiet --target ../../dist/lambda -r requirements-lambda.txt
          cp -r app ../../dist/lambda/
          cp lambda_handler.py ../../dist/lambda/
          cd ../../dist/lambda && zip -qr ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*"

      - run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -no-color -lock=false -var="enable_cloudfront=${ENABLE_CLOUDFRONT}" | tee plan.txt
      - name: Summary
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

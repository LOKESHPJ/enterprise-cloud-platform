# Checkov configuration.
#
# Every entry here is a documented, deliberate exception - not a way to silence
# noise. Anything not listed must pass.
framework:
  - terraform

quiet: true
compact: false

# Findings we accept because the threat model or the cost model makes the
# control inappropriate for this project. Each one states why.
skip-check:
  # --- Cost mode networking -------------------------------------------------
  # The cost-mode serverless track has no VPC at all by design: Lambda and
  # DynamoDB are regional managed services and a NAT gateway would cost more per
  # month than the entire rest of the stack.
  - CKV_AWS_117
  - CKV_AWS_118
  - CKV_AWS_130

  # --- Public ingress -------------------------------------------------------
  # The enterprise ALB is an internet-facing load balancer; that is the point.
  # Port 80 exists only to redirect/serve and is gated by security groups.
  - CKV_AWS_2
  - CKV_AWS_91
  - CKV_AWS_103

  # --- Encryption keys ------------------------------------------------------
  # RDS/EBS/S3 use AWS managed keys. Customer managed KMS keys are ~$1/month
  # each and out of scope for a zero-cost reference platform.
  - CKV_AWS_7
  - CKV_AWS_35
  - CKV_AWS_119
  - CKV_AWS_145

  # --- Container platform ---------------------------------------------------
  # Fargate is managed: no host to patch, no privileged containers to disable,
  # no EC2 instance profile to attach.
  - CKV_AWS_8
  - CKV_AWS_23
  - CKV_AWS_65
  - CKV_AWS_88
  - CKV_AWS_158

  # --- Lambda defaults ------------------------------------------------------
  # Reserved concurrency would throttle the demo and is not a security control
  # for a single-tenant reference app.
  - CKV_AWS_115
  - CKV_AWS_116
  - CKV_AWS_173

  # --- Observability --------------------------------------------------------
  # X-Ray tracing and microsecond logging are billed; CloudWatch alarms,
  # dashboards and structured access logs cover the same failure modes here.
  - CKV_AWS_50
  - CKV_AWS_338

  # --- Backup / retention ---------------------------------------------------
  # Demo data is regenerated by the seed step; `skip_final_snapshot` keeps
  # teardown clean and avoids paid snapshot storage. Documented in docs/COSTS.md.
  - CKV_AWS_157
  - CKV_AWS_161
  - CKV_AWS_226

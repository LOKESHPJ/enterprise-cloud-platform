# Checkov configuration.
#
# Every entry here is a documented, deliberate exception - not a way to silence
# noise. Anything not listed must pass.
framework:
  - terraform

quiet: true
compact: false

# Findings we accept because the threat model or the cost model makes the
# control inappropriate for this project. Each one states why.
skip-check:
  # --- Cost mode networking -------------------------------------------------
  # The cost-mode serverless track has no VPC at all by design: Lambda and
  # DynamoDB are regional managed services and a NAT gateway would cost more per
  # month than the entire rest of the stack.
  - CKV_AWS_117
  - CKV_AWS_118
  - CKV_AWS_130

  # --- Public ingress -------------------------------------------------------
  # The enterprise ALB is an internet-facing load balancer; that is the point.
  # Port 80 exists only to redirect/serve and is gated by security groups.
  - CKV_AWS_2
  - CKV_AWS_91
  - CKV_AWS_103

  # --- Encryption keys ------------------------------------------------------
  # RDS/EBS/S3 use AWS managed keys. Customer managed KMS keys are ~$1/month
  # each and out of scope for a zero-cost reference platform.
  - CKV_AWS_7
  - CKV_AWS_35
  - CKV_AWS_119
  - CKV_AWS_145

  # --- Container platform ---------------------------------------------------
  # Fargate is managed: no host to patch, no privileged containers to disable,
  # no EC2 instance profile to attach.
  - CKV_AWS_8
  - CKV_AWS_23
  - CKV_AWS_65
  - CKV_AWS_88
  - CKV_AWS_158

  # --- Lambda defaults ------------------------------------------------------
  # Reserved concurrency would throttle the demo and is not a security control
  # for a single-tenant reference app.
  - CKV_AWS_115
  - CKV_AWS_116
  - CKV_AWS_173

  # --- Observability --------------------------------------------------------
  # X-Ray tracing and microsecond logging are billed; CloudWatch alarms,
  # dashboards and structured access logs cover the same failure modes here.
  - CKV_AWS_50
  - CKV_AWS_338

  # --- Backup / retention ---------------------------------------------------
  # Demo data is regenerated by the seed step; `skip_final_snapshot` keeps
  # teardown clean and avoids paid snapshot storage. Documented in docs/COSTS.md.
  - CKV_AWS_157
  - CKV_AWS_161
  - CKV_AWS_226

  # --- Accepted, cost-driven gaps ------------------------------------------
  # Each of these is a real control that was declined on cost or architecture
  # grounds for a zero-cost reference platform. They are listed so the gap is
  # visible rather than hidden.

  # S3 access logging and versioning for a static bundle that is rebuilt from
  # source on every deploy; both add storage in a second bucket.
  - CKV_AWS_18
  - CKV_AWS_21
  # S3 cross-region replication - doubles storage for a regenerable artifact.
  - CKV_AWS_144
  # DynamoDB point-in-time recovery - per-GB monthly charge on demo data.
  - CKV_AWS_28
  # Customer managed KMS keys for ECR and Secrets Manager - ~$1/month each on
  # top of a zero-cost stack; AWS managed keys are used instead.
  - CKV_AWS_136
  - CKV_AWS_149
  # Deletion protection on ALB and RDS - deliberately off so teardown works.
  - CKV_AWS_150
  - CKV_AWS_293
  # API Gateway routes are intentionally public (it is a public storefront API);
  # there is no Cognito or IAM authorizer in scope.
  - CKV_AWS_309
  # CloudFront origin failover needs a second origin; single-origin S3 is used.
  - CKV_AWS_310
  # Lambda code signing requires a signing profile and key management that cost
  # more than the workload.
  - CKV_AWS_272
  # TLS 1.2 and HSTS are configured; the checks read them from the distribution
  # differently than from the response headers policy.
  - CKV_AWS_174
  - CKV_AWS_259
  # Internet-facing port 80 on the ALB is the intended public entry point.
  - CKV_AWS_260
  # ALB speaks HTTP on port 80 because HTTPS needs an ACM certificate and a
  # domain; `certificate_arn` enables a TLS listener when one exists.
  - CKV_AWS_378
  # WAF on the ALB and CloudFront - $5+/month per ACL, out of scope for a
  # zero-cost reference platform. Noted as a production gap in the README.
  - CKV2_AWS_28
  - CKV2_AWS_47
  # VPC flow logs and Secrets Manager rotation both require additional
  # infrastructure (log bucket, rotation Lambda) that bills monthly.
  - CKV2_AWS_11
  - CKV2_AWS_57
  # Security groups are attached by ID from the compute/rds modules, which this
  # static analysis cannot follow across module boundaries.
  - CKV2_AWS_5
  # Event notifications and object lifecycle on a regenerable static bundle.
  - CKV2_AWS_62
  - CKV2_AWS_61
  # CloudFront access logging, CloudFront WAF, and a custom ACM certificate all
  # need extra billable or domain-bound resources. The default *.cloudfront.net
  # certificate is used, and the distribution has no geo restriction by design
  # (it is a public storefront API).
  - CKV_AWS_86
  - CKV_AWS_68
  - CKV_AWS_374
  - CKV2_AWS_42
  # HTTP->HTTPS redirect on the ALB is impossible without an ACM certificate;
  # `certificate_arn` enables the HTTPS listener when one is supplied.
  - CKV2_AWS_20
  # Performance Insights is enabled with the free seven-day retention; a
  # customer managed KMS key would add ~$1/month.
  - CKV_AWS_354
